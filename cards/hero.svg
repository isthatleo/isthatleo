<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
    <title>NOTLXNRD profile card</title><defs>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2bb0cf"/><stop offset="1" stop-color="#1b93b1"/></linearGradient>
      <clipPath id="clip"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath>
    </defs><style>

      text{font-family:Geist,'Arial',sans-serif} .mono{font-family:'Geist Mono',monospace}

      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes reveal{from{opacity:0}to{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
      .enter{opacity:0;animation:rise .75s cubic-bezier(.2,.8,.2,1) 0.00s both}
      .fade{opacity:0;animation:reveal .7s ease 0.18s both}
      .shine{animation:sweep 5s ease-in-out 1.50s infinite}

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}animate,animateTransform,set{display:none!important}}
    </style>
    <rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#0e1116" stroke="#222933"/>
    <g clip-path="url(#clip)"><defs><linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset=".58" stop-color="#090d12"/><stop offset="1" stop-color="#10151c"/></linearGradient><radialGradient id="hero-glow"><stop stop-color="#2bb0cf" stop-opacity=".22"/><stop offset="1" stop-color="#2bb0cf" stop-opacity="0"/></radialGradient><pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9eb5c3" stroke-opacity=".055"/></pattern></defs><rect width="1200" height="330" rx="22" fill="url(#hero-bg)"/><rect width="1200" height="330" rx="22" fill="url(#hero-grid)"/><circle cx="1000" cy="120" r="280" fill="url(#hero-glow)"/><path d="M0 1H1200" stroke="url(#accent)" stroke-width="2"/><text class="mono" x="58" y="58" font-size="12" fill="#58c7dc">NOTLXNRD  /  PERSONAL ENGINEERING PROFILE</text><rect x="58" y="82" width="42" height="3" rx="1.5" fill="url(#accent)"/><text class="enter" x="54" y="166" font-size="67" font-weight="720" letter-spacing="-3.5" fill="#eef1f5">Leonard Lomude</text><text class="fade" x="59" y="207" font-size="22" font-weight="550" fill="#62c9dd">Software Engineer &amp; Product Builder</text><text class="fade" x="59" y="249" font-size="15" fill="#a8b1be">I build software, AI systems and digital products — from architecture to interface.</text><text class="mono" x="59" y="310" font-size="10" fill="#7f8a98">KAMPALA, UGANDA · WORKING GLOBALLY</text><rect x="850" y="84" width="292" height="174" rx="16" fill="#0c1218" stroke="#263642"/><text class="mono" x="878" y="119" font-size="10" fill="#718491">ENGINEERING / 001</text><circle cx="1105" cy="113" r="5" fill="#55c6dc"><animate attributeName="opacity" values=".25;.9;.25" dur="4s" repeatCount="indefinite"/></circle><path d="M878 139H1114" stroke="#25333d"/><text class="mono" x="878" y="172" font-size="11" fill="#d5e0e7">AI SYSTEMS</text><text class="mono" x="878" y="199" font-size="11" fill="#d5e0e7">PRODUCT ENGINEERING</text><text class="mono" x="878" y="226" font-size="11" fill="#d5e0e7">BUSINESS SOFTWARE</text></g></svg>
