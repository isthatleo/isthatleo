<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Leonard Lomude — NOTLXNRD</title><desc id="desc">Software Engineer and Product Builder based in Kampala, Uganda.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset=".58" stop-color="#090d12"/><stop offset="1" stop-color="#10151c"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2bb0cf"/><stop offset="1" stop-color="#6bd7e8"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2bb0cf" stop-opacity=".22"/><stop offset="1" stop-color="#2bb0cf" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9eb5c3" stroke-opacity=".055" stroke-width="1"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .reveal{animation:reveal .9s cubic-bezier(.2,.8,.2,1) both}
    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) .12s both}
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes reveal{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.22}50%{opacity:.62}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/>
<rect width="1200" height="330" rx="22" fill="url(#grid)"/>
<circle cx="1000" cy="120" r="280" fill="url(#glow)"/>
<path d="M0 1H1200" stroke="url(#signal)" stroke-width="2" opacity=".9"/>
<g class="reveal">
  <text x="58" y="58" class="mono" font-size="12" fill="#58c7dc">NOTLXNRD  /  PERSONAL ENGINEERING PROFILE</text>
  <rect x="58" y="82" width="42" height="3" rx="1.5" fill="url(#signal)"/>
</g>
<g class="rise">
  <text x="54" y="166" class="sans" font-size="67" font-weight="720" letter-spacing="-3.5" fill="#f2f5f7">Leonard Lomude</text>
  <text x="59" y="207" class="sans" font-size="22" font-weight="550" fill="#62c9dd">Software Engineer <tspan fill="#64717d">/</tspan> Product Builder</text>
  <text x="59" y="249" class="sans" font-size="15" fill="#b0bac4">I design and engineer software, AI systems and digital products.</text>
  <text x="59" y="273" class="sans" font-size="15" fill="#b0bac4">From first principles and architecture to the final interface.</text>
</g>
<g class="reveal">
  <rect x="850" y="84" width="292" height="174" rx="16" fill="#0c1218" stroke="#263642"/>
  <text x="878" y="119" class="mono" font-size="10" fill="#718491">ENGINEERING / 001</text>
  <circle cx="1105" cy="113" r="5" fill="#55c6dc" class="pulse"/>
  <path d="M878 139H1114" stroke="#25333d"/>
  <text x="878" y="172" class="mono" font-size="11" fill="#d5e0e7">AI SYSTEMS</text>
  <text x="878" y="199" class="mono" font-size="11" fill="#d5e0e7">PRODUCT ENGINEERING</text>
  <text x="878" y="226" class="mono" font-size="11" fill="#d5e0e7">BUSINESS SOFTWARE</text>
</g>
<text x="59" y="310" class="mono" font-size="10" fill="#71818d">KAMPALA, UGANDA  ·  WORKING GLOBALLY</text>
</svg>