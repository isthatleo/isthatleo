<svg xmlns="http://www.w3.org/2000/svg" width="960" height="198" viewBox="0 0 960 198" role="img">
    <title>NOTLXNRD profile card</title><defs>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2bb0cf"/><stop offset="1" stop-color="#1b93b1"/></linearGradient>
      <clipPath id="clip"><rect x="1" y="1" width="958" height="196" rx="18"/></clipPath>
    </defs><style>

      text{font-family:Geist,'Arial',sans-serif} .mono{font-family:'Geist Mono',monospace}

      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes reveal{from{opacity:0}to{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
      .enter{opacity:0;animation:rise .75s cubic-bezier(.2,.8,.2,1) 3.20s both}
      .fade{opacity:0;animation:reveal .7s ease 3.38s both}
      .shine{animation:sweep 5s ease-in-out 4.70s infinite}

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}animate,animateTransform,set{display:none!important}}
    </style>
