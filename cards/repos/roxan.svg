<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img">
    <title>NOTLXNRD profile card</title><defs>
      <linearGradient id="editorial-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151713"/><stop offset=".55" stop-color="#0f110e"/><stop offset="1" stop-color="#080907"/></linearGradient>
      <linearGradient id="editorial-acid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5ff70"/><stop offset="1" stop-color="#9dbd4a"/></linearGradient>
      <pattern id="editorial-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d8e2c9" stroke-opacity=".05"/></pattern>
      <clipPath id="clip"><rect x="1" y="1" width="958" height="238" rx="18"/></clipPath>
    </defs><style>

      text{font-family:Geist,'Arial',sans-serif} .mono{font-family:'Geist Mono',monospace}

      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes reveal{from{opacity:0}to{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
      .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) 0.32s backwards}
      .fade{animation:reveal .7s ease 0.40s backwards}
      .shine{animation:sweep 5s ease-in-out 1.82s infinite}

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}animate,animateTransform,set{display:none!important}}
    </style>
    <rect x=".5" y=".5" width="959" height="239" rx="18" fill="url(#editorial-bg)" stroke="#242922"/>
    <g clip-path="url(#clip)"><rect width="960" height="240" fill="url(#editorial-grid)" opacity="1"/><text class="mono" x="44" y="52" font-size="11" fill="#d5ff70" letter-spacing="1.6">EDUCATION TECHNOLOGY · PRODUCT DEVELOPMENT</text><text class="enter" x="44" y="110" font-size="38" font-weight="700" letter-spacing="-.8" fill="#eef1e8">ROXAN</text><text x="44" y="148" font-size="17" fill="#b7bfae">Education operations software for connected school administration, institutional workflows</text><text x="44" y="174" font-size="17" fill="#b7bfae">and reporting.</text><text x="916" y="156" font-size="86" font-weight="800" letter-spacing="-5" fill="#d5ff70" opacity=".09" text-anchor="end">03</text><path d="M44 208H916" stroke="#242922" stroke-width="1" stroke-opacity="1" fill="none"/><text class="mono" x="44" y="230" font-size="10" fill="#5f6759" letter-spacing="1.4">03  /  SELECTED WORK</text><text class="mono" x="916" y="230" font-size="10" fill="#d5ff70" letter-spacing="1.4" text-anchor="end">OPEN PROJECT  ↗</text></g></svg>
