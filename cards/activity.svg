<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img">
    <title>NOTLXNRD profile card</title><defs>
      <linearGradient id="editorial-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151713"/><stop offset=".55" stop-color="#0f110e"/><stop offset="1" stop-color="#080907"/></linearGradient>
      <linearGradient id="editorial-acid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5ff70"/><stop offset="1" stop-color="#9dbd4a"/></linearGradient>
      <pattern id="editorial-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d8e2c9" stroke-opacity=".05"/></pattern>
      <clipPath id="clip"><rect x="1" y="1" width="958" height="198" rx="18"/></clipPath>
    </defs><style>

      text{font-family:Geist,'Arial',sans-serif} .mono{font-family:'Geist Mono',monospace}

      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes reveal{from{opacity:0}to{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
      .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) 0.05s backwards}
      .fade{animation:reveal .7s ease 0.13s backwards}
      .shine{animation:sweep 5s ease-in-out 1.55s infinite}

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}animate,animateTransform,set{display:none!important}}
    </style>
    <rect x=".5" y=".5" width="959" height="199" rx="18" fill="url(#editorial-bg)" stroke="#242922"/>
    <g clip-path="url(#clip)"><rect width="960" height="200" fill="url(#editorial-grid)" opacity="1"/><text class="mono" x="44" y="50" font-size="11" fill="#d5ff70" letter-spacing="1.6">GITHUB ACTIVITY  /  LAST 12 MONTHS</text><path d="M44 78H360" stroke="url(#editorial-acid)" stroke-width="2"/><text x="44" y="122" font-size="24" font-weight="650" fill="#eef1e8">WAITING FOR VERIFIED GITHUB ACTIVITY</text><text x="44" y="156" font-size="15" fill="#b7bfae">GitHub reports no public contributions in this window. Private activity is not exposed, and no metrics are fabricated.</text></g></svg>
