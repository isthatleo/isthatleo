<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img">
    <title>NOTLXNRD profile card</title><defs>
      <linearGradient id="editorial-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151713"/><stop offset=".55" stop-color="#0f110e"/><stop offset="1" stop-color="#080907"/></linearGradient>
      <linearGradient id="editorial-acid" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5ff70"/><stop offset="1" stop-color="#9dbd4a"/></linearGradient>
      <pattern id="editorial-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d8e2c9" stroke-opacity=".05"/></pattern>
      <clipPath id="clip"><rect x="1" y="1" width="958" height="168" rx="18"/></clipPath>
    </defs><style>

      text{font-family:Geist,'Arial',sans-serif} .mono{font-family:'Geist Mono',monospace}

      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes reveal{from{opacity:0}to{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
      .enter{animation:rise .75s cubic-bezier(.2,.8,.2,1) 0.15s backwards}
      .fade{animation:reveal .7s ease 0.23s backwards}
      .shine{animation:sweep 5s ease-in-out 1.65s infinite}

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}animate,animateTransform,set{display:none!important}}
    </style>
    <rect x=".5" y=".5" width="959" height="169" rx="18" fill="url(#editorial-bg)" stroke="#242922"/>
    <g clip-path="url(#clip)"><rect width="960" height="170" fill="url(#editorial-grid)" opacity="1"/><text class="mono" x="44" y="52" font-size="11" fill="#d5ff70" letter-spacing="1.6">HAVE A GOOD PROBLEM?</text><text x="44" y="106" font-size="30" font-weight="650" fill="#eef1e8">Let’s build something useful.</text><path d="M520 74H692" stroke="#343a2c" stroke-width="1" stroke-opacity="1" fill="none"/><text x="520" y="104" font-size="18" font-weight="650" fill="#eef1e8">BUILD</text><text x="520" y="128" font-size="12" fill="#8a9282">leonardlomude.vercel.app</text><text class="mono" x="520" y="150" font-size="10" fill="#d5ff70" letter-spacing="1.4">OPEN  ↗</text><path d="M720 74H892" stroke="#343a2c" stroke-width="1" stroke-opacity="1" fill="none"/><text x="720" y="104" font-size="18" font-weight="650" fill="#eef1e8">SYSTEMS</text><text x="720" y="128" font-size="12" fill="#8a9282">github.com</text><text class="mono" x="720" y="150" font-size="10" fill="#d5ff70" letter-spacing="1.4">OPEN  ↗</text></g></svg>
